name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

env:
  MONGODB_URI: mongodb://127.0.0.1:27017/ci_build
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci_build
  AUTH_SECRET: ci-build-secret-not-for-production
  NEXTAUTH_URL: http://localhost:3001
  AUTH_TRUST_HOST: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_build
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production quality gate
        run: npm run quality:prod
