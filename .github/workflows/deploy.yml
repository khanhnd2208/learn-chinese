# Production deploy to VPS. Configure repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
# Optional: VPS_PASSWORD, VPS_SSH_PORT (default 2222 if omitted in ssh-action).

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy on VPS
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2222
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/learn-chinese
            git fetch origin main
            git reset --hard origin/main
            ./scripts/deploy.sh
            pm2 restart learn-chinese --update-env
            pm2 status learn-chinese --no-color
