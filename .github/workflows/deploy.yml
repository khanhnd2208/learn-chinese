# Production deploy to VPS.
# Repository secrets (Settings → Secrets → Actions):
#   VPS_HOST      — e.g. 217.217.253.161
#   VPS_USER      — e.g. root
#   VPS_SSH_KEY   — private key for SSH (PEM)
# Optional: VPS_SSH_PORT (default 22), VPS_PASSWORD

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy on VPS
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Sync code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: '.'
          target: /var/www/learn-chinese
          strip_components: 0
          overwrite: true
          rm: false
          exclude: node_modules,.next,.git,.env,.env.local

      - name: Build & restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/learn-chinese
            ./scripts/deploy.sh
            pm2 restart learn-chinese --update-env
            pm2 status learn-chinese --no-color
            curl -sf -o /dev/null -w "health /login -> %{http_code}\n" http://127.0.0.1:3001/login
